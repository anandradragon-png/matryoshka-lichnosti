name: CI

# Прогоняет линтер и smoke-тесты на каждый push и pull request,
# чтобы ловить опечатки/ошибки до попадания в прод.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test
