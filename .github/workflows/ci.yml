name: CI

# Прогоняет линтер и smoke-тесты на каждый push и pull request,
# чтобы ловить опечатки/ошибки до попадания в прод.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm install, а не npm ci: замок собирается на Windows, а проверка идёт
      # на Linux, и платформенные зависимости в замок не попадают. Строгий
      # npm ci из-за этого падал до линтера и тестов.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
